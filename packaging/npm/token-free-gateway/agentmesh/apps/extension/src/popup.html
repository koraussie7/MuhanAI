<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MuhanAI Bridge</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px 14px;
        width: 280px;
        background: #0a0c14;
        color: #e8eaee;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #9ca3af;
        margin: 0 0 10px;
        line-height: 1.4;
      }
      label {
        font-size: 11px;
        color: #6b7280;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin: 4px 0 10px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #1f2430;
        background: #11141d;
        color: #e8eaee;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #10b981;
        color: #04110c;
        font-weight: 700;
        cursor: pointer;
      }
      .note {
        margin-top: 10px;
        font-size: 11px;
        color: #6b7280;
      }
      .ok {
        color: #10b981;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>MuhanAI Browser Bridge</h1>
    <p>Imports answers you already see in ChatGPT / Claude / Gemini. Never sends passwords or cookies.</p>
    <label for="api">MuhanAI API base</label>
    <input id="api" type="url" placeholder="http://127.0.0.1:4000" />
    <button id="save" type="button">Save</button>
    <p id="status" class="ok" hidden>Saved</p>
    <p class="note">Open ChatGPT, Claude, or Gemini → click the green “→ MuhanAI” button on the page.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
