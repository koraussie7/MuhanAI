# MuhanAI Anchor Minidapp Configuration
# Based on agent-memory minidapp

name: MuhanAI Anchor
version: 0.1.0
description: "MuhanAI Content Anchoring Service - SHA-256 hashes to Minima chain via MDS"
author: MuhanAI Team
license: Apache-2.0

# Minidapp configuration
main: service.js
type: minidapp

# MDS configuration
mds:
  enabled: true
  namespace: "anchor"
  # Register on-chain via MDS.create()
  # script: "RETURN SIGNEDBY(@INPUT 0)"
  # amount: 0.001
  # state: [address, cid, namespace, timestamp, size, path]

# API Configuration
api:
  port: 9004
  host: 0.0.0.0
  cors: true

# MDS Configuration
mds:
  namespace: "anchor"
  # Default path prefix for anchors
  pathPrefix: "anchor/"
  # Max content size (bytes)
  maxContentSize: 1048576
  # Default amount for MDS.create
  defaultAmount: "0.001"

# Security
security:
  # Require authentication for write operations
  requireAuth: true
  # Rate limiting (requests per minute)
  rateLimit: 10

# Logging
logging:
  level: INFO
  file: /root/muhanai-data/logs/muhanai-anchor.log