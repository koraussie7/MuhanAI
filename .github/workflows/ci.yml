name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pnpm workspace (pnpm-lock.yaml, pnpm-workspace.yaml, apps/, packages/,
# services/, client-adapter/) lives under packaging/npm/token-free-gateway/agentmesh.
# actions/checkout runs from the repo root, so every subsequent step needs to
# cd into the workspace before invoking pnpm.
defaults:
  run:
    working-directory: packaging/npm/token-free-gateway/agentmesh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Run vitest with junit reporter
        run: pnpm test -- --reporter=junit --outputFile=junit.xml
        env:
          JEST_JUNIT_OUTPUT_NAME: junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests
          path: junit.xml
          reporter: jest-junit
          fail-on-error: true

  biome:
    name: Biome lint check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
