name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workspace lives under agentmesh; all run steps use this cwd.
defaults:
  run:
    working-directory: packaging/npm/token-free-gateway/agentmesh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run vitest with junit reporter
        run: pnpm test -- --reporter=junit --outputFile=junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests
          # reporter paths are relative to repo root, not working-directory
          path: packaging/npm/token-free-gateway/agentmesh/junit.xml
          reporter: jest-junit
          fail-on-error: true

  biome:
    name: Biome lint check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .

  nx-affect:
    name: Nx affected (typecheck, test, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Show projects
        run: pnpm exec nx show projects

      - name: Affected typecheck
        run: pnpm exec nx affected -t typecheck

      - name: Affected test
        run: pnpm exec nx affected -t test

      - name: Affected lint
        run: pnpm exec nx affected -t lint

      - name: Affected build
        run: pnpm exec nx affected -t build

  nx-graph:
    name: Nx project graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: packaging/npm/token-free-gateway/agentmesh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Nx show projects
        run: pnpm exec nx show projects
      - name: Nx show sample projects
        run: |
          pnpm exec nx show project @agentmesh/agent-router || true
          pnpm exec nx show project @agentmesh/llm-router || true
          pnpm exec nx show project @agentmesh/personal-mcp || true
