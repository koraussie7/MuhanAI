name = "muhanai"
main = "deploy/worker.ts"
compatibility_date = "2026-09-03"

routes = [
  { pattern = "muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "www.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "find.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "api.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "shop1.kbizhub.com/*", zone_name = "kbizhub.com" },
  { pattern = "travel.kbizhub.com/*", zone_name = "kbizhub.com" },
]
workers_dev = false

# NOTE: API_ORIGIN is intentionally left unset until api.muhanai.com is deployed.
# Leaving this empty prevents the worker from proxying /api/* requests to a dead origin,
# which was causing HTTP 522 Cloudflare origin timeouts.

[[kv_namespaces]]
binding = "FEED_KV"
id = "d686b4fb62384fb8a13d0e27c3b52947"

[[kv_namespaces]]
binding = "GLASSES_KV"
id = "9a1f3c5e7b2d4f6a8c0e2d4b6f8a0c2e"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
