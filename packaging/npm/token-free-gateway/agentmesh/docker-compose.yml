services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [infra]
    environment:
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
      POSTGRES_DB: agentmesh
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    profiles: [infra]
    ports: ["6379:6379"]
volumes:
  postgres-data:
