name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pnpm workspace (pnpm-lock.yaml, pnpm-workspace.yaml, apps/, packages/,
# services/, client-adapter/) lives under packaging/npm/token-free-gateway/agentmesh.
# actions/checkout runs from the repo root, so every subsequent step needs to
# cd into the workspace before invoking pnpm.
defaults:
  run:
    working-directory: packaging/npm/token-free-gateway/agentmesh

jobs:
  check:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint & format check
        run: pnpm biome check .

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
