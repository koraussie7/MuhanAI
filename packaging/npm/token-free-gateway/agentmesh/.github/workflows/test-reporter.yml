name: Test Reporter

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Post PR comment on failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pullRequestId = context.payload.workflow_run.pull_requests[0]?.number;
            if (!pullRequestId) {
              console.log('No PR associated with this workflow run');
              return;
            }

            const runId = context.payload.workflow_run.id;
            const url = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequestId,
              body: `❌ **CI failed** — [View logs](${url})\n\nPlease check the workflow run for details.`
            });
