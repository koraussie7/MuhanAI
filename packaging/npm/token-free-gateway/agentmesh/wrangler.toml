name = "muhanai"
main = "deploy/worker.ts"
compatibility_date = "2026-09-03"

routes = [
  { pattern = "muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "www.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "find.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "api.muhanai.com/*", zone_name = "muhanai.com" },
  { pattern = "shop1.kbizhub.com/*", zone_name = "kbizhub.com" },
  { pattern = "travel.kbizhub.com/*", zone_name = "kbizhub.com" },
  { pattern = "vn.kbizhub.com/*", zone_name = "kbizhub.com" },
  # chat.muhanai.com — Bitterbot SSR shell. See deploy/chat-handler.ts.
  # The Worker renders a minimal HTML shell on "/" and falls back to
  # ASSETS for /assets/* (same Vite-built bundle the main SPA uses).
  { pattern = "chat.muhanai.com/*", zone_name = "muhanai.com" },
  # The following hostnames are NOT Worker routes. They are proxied A records
  # pointing at the 110 origin, where Caddy terminates TLS:
  #   - hotel.kbizhub.com -> reverse-proxies to the Kamra PMS on 127.0.0.1:8000
  #   - blog.muhanai.com -> serves the Hugo build from
  #     /var/www/blog.muhanai.com/current (see deploy/Caddyfile.muhanai)
  # Adding either hostname here would let the Worker hijack it; with no matching
  # handler inside the Worker the request falls back to the origin path and fails
  # with 525/522 instead of rendering.
]
workers_dev = false

# NOTE: API_ORIGIN is intentionally left unset until api.muhanai.com is deployed.
# Leaving this empty prevents the worker from proxying /api/* requests to a dead origin,
# which was causing HTTP 522 Cloudflare origin timeouts.

# TOURMIND_USER_KEY is bound as a secret (wrangler secret put TOURMIND_USER_KEY).
# Used by the travel-api.ts hotel booking endpoints.

[[kv_namespaces]]
binding = "FEED_KV"
id = "d686b4fb62384fb8a13d0e27c3b52947"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
